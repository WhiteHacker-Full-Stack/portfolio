# WhiteHacker portfolio — nginx reverse proxy.
#
# whitehacker-portfolio.duckdns.org o'rniga boshqa domen kerak bo'lsa:
#   sudo sed -i 's/whitehacker-portfolio.duckdns.org/yangi-domen/g' \
#     /etc/nginx/sites-available/whitehacker-portfolio
#
# certbot --nginx bu faylga 443 blokini va sertifikat yo'llarini o'zi qo'shadi.

server {
    listen 80;
    listen [::]:80;
    server_name whitehacker-portfolio.duckdns.org;

    # Let's Encrypt tekshiruvi shu yerda ochiq qoladi.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    client_max_body_size 20M;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;

    # API va yuklangan fayllar — to'g'ridan-to'g'ri Express'ga.
    # Kelajakdagi Capacitor ilovasi ham shu manzillarga murojaat qiladi.
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_read_timeout 120s;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:4000;
    }

    # Qolgan hamma narsa — Next.js
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
